<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" role="img" aria-labelledby="score-flow-title score-flow-desc"><title id="score-flow-title">有趣评价：六维证据与五个评分分值</title><desc id="score-flow-desc">原始证据、校准质量与长度归一化；密度由独立分支计算；归一化质量80%和密度20%合成最终排序分。各分值取自真实R0案例。</desc><defs><marker id="score-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8294ac" stroke-width="1.5"/></marker></defs><style>text{font-family:Microsoft YaHei,system-ui,sans-serif}a:focus-visible rect,a:hover rect{stroke:#2367c9;stroke-width:2}a:focus-visible{outline:none}</style><rect x="0" y="0" width="1060" height="600" fill="white" stroke="none" rx="0"/><text x="32" y="42" font-size="25" font-weight="650" fill="#20364e" text-anchor="start">04 质量评分：把“有趣”变成有证据的评价</text><text x="32" y="76" font-size="14" font-weight="400" fill="#53677f" text-anchor="start">完整阅读分镜 → 独立证据 → 六维26项计分 → 程序校验与算分 → 人工复核</text><path d="M205 220H240" fill="none" stroke="#8294ac" stroke-width="1.5" marker-end="url(#score-arrow)"/><path d="M410 220H445" fill="none" stroke="#8294ac" stroke-width="1.5" marker-end="url(#score-arrow)"/><path d="M120 290V418H445" fill="none" stroke="#8294ac" stroke-width="1.5" marker-end="url(#score-arrow)"/><text x="142" y="394" font-size="12" font-weight="500" fill="#53677f" text-anchor="start">核心机制、镜头数与有效内容</text><path d="M615 220H715V295H790" fill="none" stroke="#8294ac" stroke-width="1.5" marker-end="url(#score-arrow)"/><text x="647" y="203" font-size="12" font-weight="500" fill="#53677f" text-anchor="start">质量分 × 80%</text><path d="M615 418H715V355H790" fill="none" stroke="#8294ac" stroke-width="1.5" marker-end="url(#score-arrow)"/><text x="648" y="443" font-size="12" font-weight="500" fill="#53677f" text-anchor="start">密度分 × 20%</text><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0" aria-label="1 原始证据分，打开R0评分记录"><rect x="35" y="150" width="170" height="140" fill="#f8faff" stroke="#a9bfdf" rx="6"/><text x="51" y="178" font-size="15" font-weight="600" fill="#20364e" text-anchor="start">1 原始证据分</text><text x="51" y="219" font-size="29" font-weight="650" fill="#1c56ac" text-anchor="start">53</text><text x="51" y="249" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">独立得分证据的合计</text><text x="51" y="271" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">回查具体机制与原文</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0" aria-label="2 校准质量分，打开R0评分记录"><rect x="240" y="150" width="170" height="140" fill="#f8faff" stroke="#a9bfdf" rx="6"/><text x="256" y="178" font-size="15" font-weight="600" fill="#20364e" text-anchor="start">2 校准质量分</text><text x="256" y="219" font-size="29" font-weight="650" fill="#1c56ac" text-anchor="start">71</text><text x="256" y="249" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">把证据分映射为质量</text><text x="256" y="271" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">用于初步质量判断</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0" aria-label="3 长度归一化，打开R0评分记录"><rect x="445" y="150" width="170" height="140" fill="#f8faff" stroke="#a9bfdf" rx="6"/><text x="461" y="178" font-size="15" font-weight="600" fill="#20364e" text-anchor="start">3 长度归一化</text><text x="461" y="219" font-size="29" font-weight="650" fill="#1c56ac" text-anchor="start">81</text><text x="461" y="249" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">按镜头数量使用阈值</text><text x="461" y="271" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">避免长稿天然占优</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0" aria-label="4 有效内容密度，打开R0评分记录"><rect x="445" y="348" width="170" height="140" fill="#f8faff" stroke="#a9bfdf" rx="6"/><text x="461" y="376" font-size="15" font-weight="600" fill="#20364e" text-anchor="start">4 有效内容密度</text><text x="461" y="417" font-size="29" font-weight="650" fill="#1c56ac" text-anchor="start">69</text><text x="461" y="447" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">识别短而密的内容</text><text x="461" y="469" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">避免靠篇幅堆高分</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0" aria-label="5 最终排序分，打开R0评分记录"><rect x="790" y="250" width="235" height="164" fill="#f8faff" stroke="#a9bfdf" rx="6"/><text x="806" y="278" font-size="15" font-weight="600" fill="#20364e" text-anchor="start">5 最终排序分</text><text x="806" y="319" font-size="29" font-weight="650" fill="#1c56ac" text-anchor="start">79</text><text x="806" y="349" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">round(81 × 80% + 69 × 20%)</text><text x="806" y="371" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">用于候选排序与比较</text><text x="806" y="393" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">不替代人工采用判断</text></a><text x="35" y="537" font-size="14" font-weight="600" fill="#20364e" text-anchor="start">六维权重 / 总分100</text><text x="35" y="568" font-size="14" font-weight="400" fill="#53677f" text-anchor="start">趣味机制40 · 儿童吸引力20 · 英语学习15 · 情绪连接10 · 想象创意10 · 结构体验5</text></svg>