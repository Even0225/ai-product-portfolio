<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 735" role="img" aria-labelledby="score-prototype-title score-prototype-desc"><title id="score-prototype-title">评分阅稿页原型：分值、六维证据、人工反馈</title><desc id="score-prototype-desc">基于真实CASE-S01的R0分值与一条原文证据，展示完整评分摘要、六维入口、证据定位和人工反馈按钮。原型热点打开真实案例。</desc><defs><marker id="score-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#8294ac" stroke-width="1.5"/></marker></defs><style>text{font-family:Microsoft YaHei,system-ui,sans-serif}a:focus-visible rect,a:hover rect{stroke:#2367c9;stroke-width:2}a:focus-visible{outline:none}</style><rect x="0" y="0" width="1060" height="735" fill="white" stroke="none" rx="0"/><text x="32" y="42" font-size="25" font-weight="650" fill="#20364e" text-anchor="start">评分阅稿页：既看排序，也看为什么得分</text><text x="32" y="76" font-size="14" font-weight="400" fill="#53677f" text-anchor="start">基于 CASE-S01 / R0 的真实分值与证据；点击热点打开现有案例。</text><rect x="25" y="100" width="1010" height="590" fill="white" stroke="#bdcce0" rx="6"/><text x="48" y="136" font-size="19" font-weight="600" fill="#20364e" text-anchor="start">第七个花盆后的醋</text><text x="1007" y="136" font-size="13" font-weight="500" fill="#53677f" text-anchor="end">当前版本 R0</text><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="48" y="157" width="184" height="76" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="60" y="182" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">原始证据</text><text x="60" y="216" font-size="22" font-weight="650" fill="#1c56ac" text-anchor="start">53</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="242" y="157" width="184" height="76" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="254" y="182" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">校准质量</text><text x="254" y="216" font-size="22" font-weight="650" fill="#1c56ac" text-anchor="start">71</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="436" y="157" width="184" height="76" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="448" y="182" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">长度归一</text><text x="448" y="216" font-size="22" font-weight="650" fill="#1c56ac" text-anchor="start">81</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="630" y="157" width="184" height="76" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="642" y="182" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">有效密度</text><text x="642" y="216" font-size="22" font-weight="650" fill="#1c56ac" text-anchor="start">69</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="824" y="157" width="184" height="76" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="836" y="182" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">最终排序</text><text x="836" y="216" font-size="22" font-weight="650" fill="#1c56ac" text-anchor="start">79</text></a><text x="48" y="273" font-size="17" font-weight="600" fill="#20364e" text-anchor="start">原文与独立计分证据</text><text x="600" y="273" font-size="17" font-weight="600" fill="#20364e" text-anchor="start">六维26项 / 点击打开评分</text><rect x="48" y="291" width="520" height="230" fill="#f8faff" stroke="#dfe6f0" rx="4"/><text x="66" y="319" font-size="12" font-weight="500" fill="#53677f" text-anchor="start">B02 · E001</text><text x="66" y="352" font-size="13" font-weight="500" fill="#20364e" text-anchor="start">Oh no, where is my vinegar? It rolled near the seven</text><text x="66" y="376" font-size="13" font-weight="500" fill="#20364e" text-anchor="start">pots.</text><text x="66" y="441" font-size="13" font-weight="400" fill="#53677f" text-anchor="start">B01建立了带醋去野餐的顺利预期，B02角色A被石子绊倒、醋瓶滚</text><text x="66" y="465" font-size="13" font-weight="400" fill="#53677f" text-anchor="start">走不见，打破预期形成儿童可理解的意外。</text><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="293" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="316" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">儿童趣味机制</text><text x="995" y="316" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">9 / 40</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="333" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="356" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">儿童吸引力</text><text x="995" y="356" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">13 / 20</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="373" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="396" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">英语学习价值</text><text x="995" y="396" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">14 / 15</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="413" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="436" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">情绪连接</text><text x="995" y="436" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">10 / 10</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="453" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="476" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">想象力与创意</text><text x="995" y="476" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">2 / 10</text></a><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="600" y="493" width="410" height="34" fill="white" stroke="#dfe6f0" rx="3"/><text x="612" y="516" font-size="13" font-weight="400" fill="#20364e" text-anchor="start">结构完整与观看体验</text><text x="995" y="516" font-size="13" font-weight="600" fill="#1c56ac" text-anchor="end">5 / 5</text></a><text x="48" y="556" font-size="13" font-weight="500" fill="#20364e" text-anchor="start">每个 +1 分对应独立证据；保留原文、得分理由与镜头定位。</text><text x="48" y="584" font-size="12" font-weight="400" fill="#53677f" text-anchor="start">R1 / R2 的正文已修订，但未重跑评分；R0 的79分不作为修订版成绩。</text><a href="../demos/content-production/index.html#script/score?panel=score&amp;version=R0"><rect x="48" y="617" width="188" height="43" fill="#2367c9" stroke="#2367c9" rx="5"/><text x="142" y="644" font-size="13" font-weight="600" fill="white" text-anchor="middle">展开原文与六维证据</text></a><a href="../demos/content-production/index.html#script/revision?revision=R2"><rect x="254" y="617" width="188" height="43" fill="white" stroke="#a9bfdf" rx="5"/><text x="348" y="644" font-size="12" font-weight="600" fill="#1c56ac" text-anchor="middle">提出意见 / 查看版本对比</text></a><text x="48" y="718" font-size="13" font-weight="400" fill="#53677f" text-anchor="start">评分输出组织判断依据，最终由人工决定采用、微调或返工。</text></svg>