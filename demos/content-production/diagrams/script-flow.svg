ont-weight="600">确认采用当前版本</text></a><a href="../index.html#script/delivery" aria-label="保存入库并提供 TXT，查看对应案例" class="diagram-link"><title>保存入库并提供 TXT，查看对应案例</title><rect x="275.0" y="1308.0" width="250" height="68" rx="0" fill="#f1f5fc" stroke="#75879b" stroke-width="1.5"/><text x="400" y="1333" text-anchor="middle" font-size="11" fill="#53677f" font-weight="400">系统</text><text x="400" y="1357" text-anchor="middle" font-size="16" fill="#20364e" font-weight="600">保存入库并提供 TXT</text></a><a href="../index.html#script/delivery" aria-label="完成本次交付，查看对应案例" class="diagram-link"><title>完成本次交付，查看对应案例</title><rect x="305.0" y="1405.0" width="190" height="50" rx="25.0" fill="#fff" stroke="#75879b" stroke-width="1.5"/><text x="400" y="1435" text-anchor="middle" font-size="15" fill="#20364e" font-weight="600">完成本次交付</text></a><a href="../index.html#script/chain?node=0" aria-label="规划可交接？，查看对应案例" class="diagram-link"><title>规划可交接？，查看对应案例</title><polygon points="400,350.0 490.0,398 400,446.0 310.0,398" fill="#f5f8fd" stroke="#244fba" stroke-width="1.6"/><text x="400" y="403" text-anchor="middle" font-size="15" fill="#20364e" font-weight="600">规划可交接？</text></a><a href="../index.html#script/chain?node=1" aria-label="硬校验通过？，查看对应案例" class="diagram-link"><title>硬校验通过？，查看对应案例</title><polygon points="400,568.0 490.0,616 400,664.0 310.0,616" fill="#f5f8fd" stroke="#244fba" stroke-width="1.6"/><text x="400" y="621" text-anchor="middle" font-size="15" fill="#20364e" font-weight="600">硬校验通过？</text></a><a href="../index.html#script/chain?panel=stop-policy" aria-label="保留问题，重做规划，查看对应案例" class="diagram-link"><title>保留问题，重做规划，查看对应案例</title><rect x="5.0" y="364.0" width="220" height="68" rx="0" fill="#fff" stroke="#75879b" stroke-width="1.5"/><text x="115" y="389" text-anchor="middle" font-size="11" fill="#53677f" font-weight="400">用户 · 确认恢复后</text><text x="115" y="413" text-anchor="middle" font-size="16" fill="#20364e" font-weight="600">保留问题，重做规划</text></a><a href="../index.html#script/chain?panel=stop-policy" aria-label="保留问题，修正起草，查看对应案例" class="diagram-link"><title>保留问题，修正起草，查看对应案例</title><rect x="5.0" y="582.0" width="220" height="68" rx="0" fill="#fff" stroke="#75879b" stroke-width="1.5"/><text x="115" y="607" text-anchor="middle" font-size="11" fill="#53677f" font-weight="400">用户 · 确认恢复后</text><text x="115" y="631" text-anchor="middle" font-size="16" fill="#20364e" font-weight="600">保留问题，修正起草</text></a><path d="M 525 294 L 600 294" fill="none" stroke="#8e9bad" stroke-width="1.2" stroke-dasharray="5 4"/><text x="625" y="276" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">角色目标 → 触发事件 → 问题 → 解决机制</text><text x="625" y="298" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">情节因果清楚，每个目标词有铺垫、发展与兑现</text><text x="625" y="320" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">内容完整，目标词、策略与角色范围绑定一致</text><path d="M 525 512 L 600 512" fill="none" stroke="#8e9bad" stroke-width="1.2" stroke-dasharray="5 4"/><text x="625" y="494" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">本地硬校验：正文结构、双语与角色范围</text><text x="625" y="516" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">对白词数、单句长度、目标词复现满足要求</text><text x="625" y="538" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">未分配词不混入英文正文；通过才交语义门禁</text><path d="M 525 730 L 600 730" fill="none" stroke="#8e9bad" stroke-width="1.2" stroke-dasharray="5 4"/><text x="625" y="712" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">语义判断：词义与情节一致，角色表现合规</text><text x="625" y="734" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">儿童安全符合约束，故事因果与解决方式成立</text><text x="625" y="756" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">需人工判断或被阻断：保留问题，停止评分</text><path d="M 525 948 L 600 948" fill="none" stroke="#8e9bad" stroke-width="1.2" stroke-dasharray="5 4"/><text x="625" y="930" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">六维、26 个子项，逐项保留正文依据</text><text x="625" y="952" text-anchor="start" font-size="14" fill="#53677f" font-weight="400">本案例评分作人工参考，不按分数自动拦截</text></svg>