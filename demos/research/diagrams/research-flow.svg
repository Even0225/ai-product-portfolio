<svg xmlns="http://www.w3.org/2000/svg" class="design-svg" data-diagram="research-flow" width="1120" height="1520" viewBox="0 0 1120 1520" role="group" aria-labelledby="research-flow-title research-flow-desc">
<title id="research-flow-title">交点：科研探索业务流程</title><desc id="research-flow-desc">主线从学科组合到研究方案；文献阅读、用途说明和画布修改可反复往返。节点链接进入独立示例工作区。</desc>
<style>
.design-svg text{font-family:"Noto Sans SC","Microsoft YaHei UI","PingFang SC",sans-serif;font-size:21px;fill:#243747;pointer-events:none}
.design-svg .small{font-size:16px;fill:#586a79}.design-svg .label{font-size:18px;fill:#335f83}
.design-svg .node-shape,.design-svg .page-frame{fill:#fff;stroke:#8295a5;stroke-width:1.5}
.design-svg .terminal{fill:#edf3f8;stroke:#335f83;stroke-width:1.5}
.design-svg .decision{fill:#edf3f8;stroke:#335f83;stroke-width:1.5}
.design-svg .edge{fill:none;stroke:#788e9f;stroke-width:1.8;marker-end:url(#research-flow-arrow)}
.design-svg .optional-edge{fill:none;stroke:#3a7168;stroke-width:1.5;stroke-dasharray:7 5}
.design-svg .optional{fill:#f1f7f4;stroke:#6f988b;stroke-width:1.5}
.design-svg .hotspot{fill:#edf3f8;stroke:#335f83;stroke-width:1.6}
.design-svg .surface{fill:#f8fafc;stroke:#dce3e9;stroke-width:1}
.design-svg .selected{fill:#edf3f8;stroke:#335f83;stroke-width:1.4}
.design-svg .nav{fill:#182f41}.design-svg .on-nav{fill:#e7eef4;font-size:15px}
.design-svg a{cursor:pointer;text-decoration:none}.design-svg a:hover .node-shape,.design-svg a:focus-visible .node-shape,.design-svg a:hover .hotspot,.design-svg a:focus-visible .hotspot,.design-svg a:hover .selected,.design-svg a:focus-visible .selected{stroke:#274b69;stroke-width:3;fill:#edf3f8}
.design-svg a:focus-visible{outline:3px solid #335f83;outline-offset:5px}
</style><defs><marker id="research-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#788e9f" stroke-width="1.4"/></marker></defs>
<g data-node-id="start" data-kind="terminal"><rect class="terminal" x="340" y="28" width="420" height="54" rx="27"/><text x="550" y="62" class="" text-anchor="middle">开始一次选题探索</text></g><a href="../index.html?case=restoration&amp;from=flow#disciplines" aria-label="进入选择基础学科与交叉视角示例"><g data-node-id="disciplines" data-kind="task"><rect class="node-shape" x="340" y="116" width="420" height="84" rx="0"/><text x="550" y="150" class="" text-anchor="middle">选择基础学科与交叉视角</text><text x="550" y="178" class="small" text-anchor="middle">研究者选择，系统组织组合</text></g></a><a href="../index.html?case=restoration&amp;from=flow#canvas" aria-label="进入绘制初步思路示例"><g data-node-id="initial-map" data-kind="task"><rect class="node-shape" x="340" y="238" width="420" height="84" rx="0"/><text x="550" y="272" class="" text-anchor="middle">绘制初步思路</text><text x="550" y="300" class="small" text-anchor="middle">研究者拖拽、连线、记录想法</text></g></a><a href="../index.html?case=restoration&amp;from=flow#directions" aria-label="进入聚焦一个研究方向示例"><g data-node-id="directions" data-kind="task"><rect class="node-shape" x="340" y="360" width="420" height="84" rx="0"/><text x="550" y="394" class="" text-anchor="middle">聚焦一个研究方向</text><text x="550" y="422" class="small" text-anchor="middle">研究者比较候选方向与未知</text></g></a><a href="../index.html?case=restoration&amp;from=flow#question" aria-label="进入明确研究问题示例"><g data-node-id="question" data-kind="task"><rect class="node-shape" x="340" y="482" width="420" height="84" rx="0"/><text x="550" y="516" class="" text-anchor="middle">明确研究问题</text><text x="550" y="544" class="small" text-anchor="middle">研究者限定对象、变量与比较条件</text></g></a><a href="../index.html?case=restoration&amp;from=flow#research/evidence" aria-label="进入检索、阅读与选择文献示例"><g data-node-id="papers" data-kind="task"><rect class="node-shape" x="340" y="604" width="420" height="84" rx="0"/><text x="550" y="638" class="" text-anchor="middle">检索、阅读与选择文献</text><text x="550" y="666" class="small" text-anchor="middle">系统检索题录，研究者判断内容</text></g></a><a href="../index.html?case=restoration&amp;from=flow#research/canvas" aria-label="进入写清文献用途与借鉴说明示例"><g data-node-id="paper-use" data-kind="task"><rect class="node-shape" x="340" y="726" width="420" height="84" rx="0"/><text x="550" y="760" class="" text-anchor="middle">写清文献用途与借鉴说明</text><text x="550" y="788" class="small" text-anchor="middle">研究者选择方法、创新点、综述等用途</text></g></a><a href="../index.html?case=restoration&amp;from=flow#research/canvas" aria-label="进入把文献和新想法放进框架示例"><g data-node-id="working-map" data-kind="task"><rect class="node-shape" x="340" y="848" width="420" height="84" rx="0"/><text x="550" y="882" class="" text-anchor="middle">把文献和新想法放进框架</text><text x="550" y="910" class="small" text-anchor="middle">研究者调整节点、关系与使用说明</text></g></a><path class="edge" d="M550 82V116"/><path class="edge" d="M550 200V238"/><path class="edge" d="M550 322V360"/><path class="edge" d="M550 444V482"/><path class="edge" d="M550 566V604"/><path class="edge" d="M550 688V726"/><path class="edge" d="M550 810V848"/><path class="edge" d="M550 932V984"/><path class="edge" d="M550 1110V1170"/><path class="edge" d="M550 1254V1292"/><path class="edge" d="M550 1376V1414"/><g data-node-id="continue" data-kind="decision"><path class="decision" d="M550 984 720 1047 550 1110 380 1047Z"/><text x="550" y="1044" class="" text-anchor="middle">准备进入研究方案？</text><text x="550" y="1072" class="small" text-anchor="middle">由研究者决定</text></g><path class="edge" d="M380 1047H150V646H340"/><text x="246" y="1028" class="label" text-anchor="middle">继续补文献</text><path class="edge" d="M720 1047H970V890H760"/><text x="868" y="1028" class="label" text-anchor="middle">继续改思路</text><text x="593" y="1146" class="label" text-anchor="start">进入深化</text><a href="../index.html?case=restoration&amp;from=flow#research/plan" aria-label="进入整理研究方案草稿示例"><g data-node-id="plan" data-kind="task"><rect class="node-shape" x="340" y="1170" width="420" height="84" rx="0"/><text x="550" y="1204" class="" text-anchor="middle">整理研究方案草稿</text><text x="550" y="1232" class="small" text-anchor="middle">研究者补写假设、方法与下一步行动</text></g></a><a href="../index.html?case=restoration&amp;from=flow#research/plan" aria-label="进入保存、导出与继续修改示例"><g data-node-id="export" data-kind="task"><rect class="node-shape" x="340" y="1292" width="420" height="84" rx="0"/><text x="550" y="1326" class="" text-anchor="middle">保存、导出与继续修改</text><text x="550" y="1354" class="small" text-anchor="middle">系统保存版本，研究者可返回画布</text></g></a><g data-node-id="end" data-kind="terminal"><rect class="terminal" x="340" y="1414" width="420" height="54" rx="27"/><text x="550" y="1448" class="" text-anchor="middle">得到可继续深化的研究草稿</text></g><path class="optional-edge" d="M760 874H790V753H810"/><a href="../index.html?case=restoration&amp;from=flow#research/canvas" aria-label="查看可选模型研讨入口"><g data-node-id="discussion" data-kind="optional"><rect x="810" y="690" width="280" height="126" rx="10" class="optional"/><text x="950" y="724" class="" text-anchor="middle">模型研讨（可选）</text><text x="950" y="754" class="small" text-anchor="middle">导出当前上下文，到外部讨论</text><text x="950" y="782" class="small" text-anchor="middle">新想法由研究者带回画布</text></g></a><text x="950" y="846" class="small" text-anchor="middle">当前提供入口与上下文导出</text></svg>